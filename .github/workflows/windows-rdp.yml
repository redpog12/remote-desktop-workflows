      - name: Start Cloudflare Tunnel
        run: |
          Write-Host "============================================"
          Write-Host "🚀 WINDOWS RDP - CLOUDFLARE TUNNEL"
          Write-Host "============================================"
          
          # Start tunnel and capture output
          $tempLog = "$env:TEMP\tunnel.log"
          $process = Start-Process -FilePath "cloudflared" -ArgumentList "tunnel --url tcp://localhost:3389" -NoNewWindow -PassThru -RedirectStandardOutput $tempLog -RedirectStandardError $tempLog
          
          Start-Sleep -Seconds 10
          
          # Read and display the URL from the log
          $logContent = Get-Content $tempLog -Raw
          if ($logContent -match '(https?://[a-zA-Z0-9.-]+\.trycloudflare\.com)') {
              $url = $matches[1]
              Write-Host ""
              Write-Host "🔗 CONNECTION URL: $url"
              Write-Host ""
          }
          
          Write-Host "📋 CONNECTION DETAILS:"
          Write-Host "   USERNAME: runneradmin"
          Write-Host "   PASSWORD: P@ssw0rd123!"
          Write-Host "   OS: Windows Server 2022"
          Write-Host "   CPU: 4 cores"
          Write-Host "   RAM: 16GB"
          Write-Host "============================================"
          
          # Keep the process running
          Wait-Process -Id $process.Id
